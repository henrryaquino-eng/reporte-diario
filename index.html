<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<title>Reporte Diario de Mantenimiento</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f3f4f6;color:#111827}
header{background:#1f2937;color:#fff;padding:24px 18px 20px}
header h1{margin:0;font-size:25px;line-height:1.15}
header p{margin:8px 0 0;color:#d1d5db}
main{max-width:900px;margin:auto;padding:16px}
.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
h2{margin:0 0 16px;font-size:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-weight:700;font-size:15px;margin-bottom:6px}
input,select,textarea{width:100%;border:1px solid #d1d5db;border-radius:10px;padding:13px;font-size:16px;background:#fff;color:#111827}
textarea{min-height:100px;resize:vertical}
.full{grid-column:1/-1}
button{border:0;border-radius:11px;padding:14px 18px;font-size:16px;font-weight:700;cursor:pointer}
.primary{background:#2563eb;color:#fff}
.gray{background:#e5e7eb;color:#111827}
.danger{background:#fee2e2;color:#991b1b}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.photoBox{margin-top:10px}
.photoPreview{display:none;width:100%;max-height:360px;object-fit:contain;border-radius:12px;background:#f3f4f6;margin-top:12px}
.notice{margin-top:8px;padding:12px;border-radius:10px;background:#eff6ff;color:#1d4ed8;font-weight:600}
.required{color:#dc2626}
.record{border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin-top:12px}
.record h3{margin:0 0 8px}
.record p{margin:5px 0}
.record img{display:block;width:100%;max-height:280px;object-fit:contain;border-radius:10px;margin-top:10px;background:#f3f4f6}
.small{font-size:13px;color:#6b7280}
.empty{color:#6b7280;text-align:center;padding:18px}
@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<header>
  <h1>Reporte Diario de Mantenimiento</h1>
  <p>V1 — prototipo offline</p>
</header>

<main>
<section class="card">
<h2>Registrar equipo</h2>

<div class="grid">
  <div>
    <label for="fEquipo">Nombre del equipo</label>
    <input id="fEquipo" placeholder="Ej. Simba">
  </div>

  <div>
    <label for="fCodigo">Código / identificación</label>
    <input id="fCodigo" placeholder="Ej. S7C-7">
  </div>

  <div>
    <label for="fUbicacion">Ubicación</label>
    <input id="fUbicacion" placeholder="Ej. Nivel 420">
  </div>

  <div>
    <label for="fTipo">Tipo de mantenimiento</label>
    <select id="fTipo">
      <option>PREVENTIVO</option>
      <option>CORRECTIVO</option>
    </select>
  </div>

  <div>
    <label for="fEstado">Estado del equipo</label>
    <select id="fEstado">
      <option>OPERATIVO</option>
      <option>OPERATIVO CON OBSERVACIÓN</option>
      <option>FUERA DE SERVICIO</option>
    </select>
  </div>

  <div>
    <label for="fHora">Horario</label>
    <input id="fHora" placeholder="09:00 – 10:30">
  </div>

  <div>
    <label for="fDemora">Demora</label>
    <input id="fDemora" placeholder="N.A. / Gestión de repuesto">
  </div>

  <div>
    <label for="fDet">Detención</label>
    <select id="fDet">
      <option>PARADA</option>
      <option>CORRECTIVO</option>
      <option>NO APLICA</option>
    </select>
  </div>

  <div>
    <label for="fTec">Técnicos</label>
    <input id="fTec" placeholder="Nombres de técnicos">
  </div>

  <div class="full">
    <label for="fActividad">Descripción de la actividad</label>
    <textarea id="fActividad" placeholder="Describa la actividad realizada"></textarea>
  </div>

  <div class="full">
    <label for="fAnomalia">Anomalía detectada</label>
    <textarea id="fAnomalia" placeholder="Describa la anomalía detectada"></textarea>
  </div>

  <div class="full">
    <label for="fObs">Observaciones</label>
    <textarea id="fObs" placeholder="N.A."></textarea>
  </div>

  <div class="full photoBox">
    <label for="fPhoto">Fotografía (opcional)</label>

    <!-- IMPORTANTE: no usamos capture="environment".
         En iPhone esto permite seleccionar una foto de la Fototeca
         además de ofrecer las opciones disponibles del sistema. -->
    <input id="fPhoto" type="file" accept="image/*" onchange="previewPhoto()">

    <img id="preview" class="photoPreview" alt="Vista previa de la fotografía">

    <label for="fPhotoComment" style="margin-top:12px">
      Comentario de la fotografía <span class="required">*</span>
    </label>
    <textarea id="fPhotoComment" placeholder="Describa qué se observa en la fotografía"></textarea>

    <div class="notice">
      Si agrega una fotografía, el comentario es obligatorio.
    </div>
  </div>
</div>

<div class="actions">
  <button class="primary" onclick="saveRecord()">Guardar registro</button>
  <button class="gray" onclick="clearForm()">Limpiar</button>
</div>
</section>

<section class="card">
<h2>Registros de equipos</h2>
<div id="records"></div>
</section>
</main>

<script>
const KEY = "reporte-diario-v1";
let data = JSON.parse(localStorage.getItem(KEY) || "null") || {records:[]};

function previewPhoto(){
  const input=document.getElementById("fPhoto");
  const preview=document.getElementById("preview");
  const file=input.files && input.files[0];

  if(!file){
    preview.src="";
    preview.style.display="none";
    return;
  }

  if(!file.type.startsWith("image/")){
    alert("Seleccione una imagen.");
    input.value="";
    preview.src="";
    preview.style.display="none";
    return;
  }

  const reader=new FileReader();
  reader.onload=()=>{preview.src=reader.result;preview.style.display="block"};
  reader.readAsDataURL(file);
}

function getPhotoData(){
  return new Promise((resolve,reject)=>{
    const input=document.getElementById("fPhoto");
    const file=input.files && input.files[0];
    if(!file){resolve("");return}
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

async function saveRecord(){
  const equipo=document.getElementById("fEquipo").value.trim();
  const codigo=document.getElementById("fCodigo").value.trim();
  const actividad=document.getElementById("fActividad").value.trim();
  const photoComment=document.getElementById("fPhotoComment").value.trim();
  const photo=document.getElementById("fPhoto").files[0];

  if(!equipo){alert("Ingrese el nombre del equipo.");return}
  if(!codigo){alert("Ingrese el código o identificación.");return}
  if(!actividad){alert("Ingrese la descripción de la actividad.");return}
  if(photo && !photoComment){
    alert("Si agrega una fotografía, el comentario de la fotografía es obligatorio.");
    document.getElementById("fPhotoComment").focus();
    return;
  }

  const record={
    id:Date.now(),
    fecha:new Date().toLocaleString("es-PE"),
    equipo,
    codigo,
    ubicacion:document.getElementById("fUbicacion").value.trim(),
    tipo:document.getElementById("fTipo").value,
    estado:document.getElementById("fEstado").value,
    hora:document.getElementById("fHora").value.trim(),
    demora:document.getElementById("fDemora").value.trim(),
    detencion:document.getElementById("fDet").value,
    tecnicos:document.getElementById("fTec").value.trim(),
    actividad,
    anomalia:document.getElementById("fAnomalia").value.trim(),
    observaciones:document.getElementById("fObs").value.trim() || "N.A.",
    photo:await getPhotoData(),
    photoComment
  };

  data.records.unshift(record);
  localStorage.setItem(KEY,JSON.stringify(data));
  renderRecords();
  clearForm();
  alert("Registro guardado correctamente.");
}

function clearForm(){
  ["fEquipo","fCodigo","fUbicacion","fHora","fDemora","fTec","fActividad","fAnomalia","fObs","fPhotoComment"].forEach(id=>{
    document.getElementById(id).value="";
  });
  document.getElementById("fTipo").value="PREVENTIVO";
  document.getElementById("fEstado").value="OPERATIVO";
  document.getElementById("fDet").value="PARADA";
  document.getElementById("fPhoto").value="";
  document.getElementById("preview").src="";
  document.getElementById("preview").style.display="none";
}

function deleteRecord(id){
  if(!confirm("¿Eliminar este registro?")) return;
  data.records=data.records.filter(r=>r.id!==id);
  localStorage.setItem(KEY,JSON.stringify(data));
  renderRecords();
}

function esc(v){
  return String(v ?? "").replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[m]));
}

function renderRecords(){
  const box=document.getElementById("records");
  if(!data.records.length){
    box.innerHTML='<div class="empty">No hay registros todavía.</div>';
    return;
  }

  box.innerHTML=data.records.map(r=>`
    <article class="record">
      <h3>${esc(r.codigo)} — ${esc(r.equipo)}</h3>
      <p><b>Fecha:</b> ${esc(r.fecha)}</p>
      <p><b>Ubicación:</b> ${esc(r.ubicacion || "N.A.")}</p>
      <p><b>Tipo:</b> ${esc(r.tipo)} &nbsp; <b>Estado:</b> ${esc(r.estado)}</p>
      <p><b>Actividad:</b> ${esc(r.actividad)}</p>
      <p><b>Anomalía:</b> ${esc(r.anomalia || "N.A.")}</p>
      <p><b>Demora:</b> ${esc(r.demora || "N.A.")}</p>
      <p><b>Técnicos:</b> ${esc(r.tecnicos || "N.A.")}</p>
      <p><b>Obs.:</b> ${esc(r.observaciones)}</p>
      ${r.photo ? `<img src="${r.photo}" alt="Fotografía del registro">` : ""}
      ${r.photo ? `<p><b>Comentario de la fotografía:</b> ${esc(r.photoComment)}</p>` : ""}
      <div class="actions">
        <button class="danger" onclick="deleteRecord(${r.id})">Eliminar</button>
      </div>
    </article>
  `).join("");
}

renderRecords();
</script>
</body>
</html>

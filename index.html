<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b57d0">
<title>Reporte Diario</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6f8;color:#18212b}
header{background:#0b57d0;color:white;padding:18px 16px 16px;position:sticky;top:0;z-index:5}h1{margin:0;font-size:22px}header p{margin:4px 0 0;opacity:.9;font-size:13px}
main{max-width:760px;margin:auto;padding:14px}.card{background:white;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #00000012}
label{display:block;font-weight:650;font-size:14px;margin:0 0 7px}input,select,textarea,button{font:inherit}
input,select,textarea{width:100%;padding:12px;border:1px solid #cbd2d9;border-radius:10px;background:white;color:#18212b}
input:focus,select:focus,textarea:focus{outline:2px solid #8ab4f8;border-color:#0b57d0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:13px}.full{grid-column:1/-1}
.row{display:flex;gap:8px}.row>*{flex:1}.small{font-size:12px;color:#68727d;margin-top:5px}
button{border:0;border-radius:10px;padding:12px 15px;font-weight:700;cursor:pointer}.primary{background:#0b57d0;color:#fff}.secondary{background:#e8eef8;color:#174ea6}.danger{background:#fde8e7;color:#b3261e}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}.photo-preview{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.photo-box{border:1px solid #d7dce1;border-radius:10px;padding:8px}.photo-box img{width:100%;height:180px;object-fit:contain;background:#f0f2f4;border-radius:7px}.photo-box textarea{margin-top:7px;min-height:70px}
.record{border-top:1px solid #e4e7ea;padding:12px 0}.record:first-child{border-top:0}.record-title{font-weight:750}.badge{display:inline-block;background:#e8f0fe;color:#174ea6;padding:4px 8px;border-radius:20px;font-size:12px;margin-top:5px}
#msg{position:fixed;left:14px;right:14px;bottom:14px;background:#202124;color:white;padding:12px 14px;border-radius:10px;display:none;z-index:20}
@media(max-width:560px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.photo-preview{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>Reporte Diario</h1><p>Registro de mantenimiento de equipos</p></header>
<main>
<form id="reportForm">
<section class="card">
<h2>Datos del reporte</h2>
<div class="grid">
<div class="field">
<label for="equipment">Código de equipo</label>
<select id="equipment" required>
<option value="">Seleccione un equipo</option>
</select>
<div class="small">Si no aparece, use “Agregar código”.</div>
</div>
<div class="field">
<label>&nbsp;</label><button type="button" class="secondary" id="addCode">Agregar código</button>
</div>
<div class="field">
<label for="date">Fecha y hora</label>
<input id="date" type="datetime-local" required>
</div>
<div class="field">
<label for="maintenance">Tipo de mantenimiento</label>
<select id="maintenance" required>
<option value="">Seleccione</option><option>Preventivo</option><option>Correctivo</option><option>Inspección</option><option>Emergencia</option>
</select>
</div>
<div class="field">
<label for="source">Fuente</label>
<input id="source" placeholder="Ej.: inspección en PM">
</div>
<div class="field">
<label for="status">Estado del equipo</label>
<select id="status" required>
<option value="">Seleccione</option><option>Operativo</option><option>Inoperativo</option><option>Parada</option>
</select>
</div>
<div class="field full">
<label for="activity">Descripción / actividad realizada</label>
<textarea id="activity" rows="4" placeholder="Describa brevemente el trabajo realizado o la observación"></textarea>
</div>
<div class="field">
<label for="technicians">Técnicos</label>
<input id="technicians" placeholder="Nombres">
</div>
<div class="field">
<label for="supervisor">Supervisor</label>
<input id="supervisor" placeholder="Nombre del supervisor">
</div>
</div>
</section>

<section class="card">
<h2>Fotografías</h2>
<label for="photos">Seleccionar desde galería</label>
<input id="photos" type="file" accept="image/*" multiple>
<div class="small">Máximo 2 fotografías. Si agrega una fotografía, el comentario de cada fotografía es obligatorio.</div>
<div id="photoPreview" class="photo-preview"></div>
</section>

<section class="card">
<div class="toolbar">
<button class="primary" type="submit">Guardar reporte</button>
<button class="secondary" type="button" id="clear">Limpiar</button>
</div>
</section>
</form>

<section class="card">
<h2>Registros guardados</h2>
<div id="records"><div class="small">No hay registros todavía.</div></div>
</section>
</main>
<div id="msg"></div>

<script>
const DEFAULT_CODES=["S7C-4","S7C-5","S7C-6","S7C-7","S7C-8","T1D-3","T1D-4","SC-39","SC-41","SC-42","SC-45","SC-46"];
const codeKey="reporteDiarioCodes_v3", recordsKey="reporteDiarioRecords_v3";
const $=id=>document.getElementById(id);
let selectedPhotos=[];

function loadCodes(){
  let codes=JSON.parse(localStorage.getItem(codeKey)||"null");
  if(!Array.isArray(codes)) codes=[...DEFAULT_CODES];
  codes=[...new Set(codes.map(x=>String(x).trim().toUpperCase()).filter(Boolean))];
  localStorage.setItem(codeKey,JSON.stringify(codes));
  $("equipment").innerHTML='<option value="">Seleccione un equipo</option>'+codes.map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("");
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function nowLocal(){
  const d=new Date(), pad=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function notify(t){$("msg").textContent=t;$("msg").style.display="block";clearTimeout(window._nt);window._nt=setTimeout(()=>$("msg").style.display="none",2600);}
function renderPhotos(){
  $("photoPreview").innerHTML=selectedPhotos.map((p,i)=>`
  <div class="photo-box">
    <img src="${p.data}" alt="Fotografía ${i+1}">
    <textarea data-comment="${i}" placeholder="Comentario obligatorio de la fotografía"></textarea>
  </div>`).join("");
}
$("photos").addEventListener("change",e=>{
  const files=[...e.target.files].slice(0,2);
  if(e.target.files.length>2) notify("Solo se pueden agregar 2 fotografías.");
  selectedPhotos=[];
  files.forEach(file=>{
    const r=new FileReader();
    r.onload=ev=>{selectedPhotos.push({name:file.name,data:ev.target.result});renderPhotos()};
    r.readAsDataURL(file);
  });
});
$("addCode").addEventListener("click",()=>{
  const code=prompt("Ingrese el nuevo código de equipo:");
  if(!code) return;
  const clean=code.trim().toUpperCase();
  if(!/^[A-Z0-9]+(?:-[A-Z0-9]+)+$/.test(clean)){notify("Formato no válido. Ejemplo: S7C-9");return}
  let codes=JSON.parse(localStorage.getItem(codeKey)||"[]");
  if(!codes.includes(clean)) codes.push(clean);
  localStorage.setItem(codeKey,JSON.stringify(codes));loadCodes();$("equipment").value=clean;notify("Código agregado.");
});
function getRecords(){return JSON.parse(localStorage.getItem(recordsKey)||"[]")}
function renderRecords(){
  const records=getRecords();
  if(!records.length){$("records").innerHTML='<div class="small">No hay registros todavía.</div>';return}
  $("records").innerHTML=records.slice().reverse().map((r,idx)=>`
  <div class="record">
    <div class="record-title">${escapeHtml(r.equipment)} <span class="badge">${escapeHtml(r.status)}</span></div>
    <div class="small">${escapeHtml(r.date)} · ${escapeHtml(r.maintenance)}</div>
    ${r.activity?`<p>${escapeHtml(r.activity)}</p>`:""}
    ${r.photos?.length?`<div class="photo-preview">${r.photos.map(p=>`<div class="photo-box"><img src="${p.data}"><div class="small">${escapeHtml(p.comment)}</div></div>`).join("")}</div>`:""}
  </div>`).join("");
}
$("reportForm").addEventListener("submit",e=>{
  e.preventDefault();
  if(!$("equipment").value){notify("Seleccione un equipo.");return}
  if(selectedPhotos.length){
    const comments=[...document.querySelectorAll("[data-comment]")].map(x=>x.value.trim());
    if(comments.some(c=>!c)){notify("El comentario es obligatorio cuando se agrega una fotografía.");return}
    selectedPhotos=selectedPhotos.map((p,i)=>({...p,comment:comments[i]}));
  }
  const r={equipment:$("equipment").value,date:$("date").value,maintenance:$("maintenance").value,
    source:$("source").value.trim(),status:$("status").value,activity:$("activity").value.trim(),
    technicians:$("technicians").value.trim(),supervisor:$("supervisor").value.trim(),photos:selectedPhotos};
  const records=getRecords();records.push(r);localStorage.setItem(recordsKey,JSON.stringify(records));
  notify("Reporte guardado correctamente.");clearForm();renderRecords();
});
function clearForm(){
  $("reportForm").reset();$("date").value=nowLocal();selectedPhotos=[];$("photoPreview").innerHTML="";
}
$("clear").addEventListener("click",clearForm);
loadCodes();clearForm();renderRecords();
</script>
</body>
</html>

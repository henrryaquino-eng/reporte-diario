<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reporte Diario</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;color:#111827}
header{background:#17365d;color:white;padding:18px 16px;position:sticky;top:0;z-index:5}
h1{font-size:22px;margin:0 0 4px}.sub{font-size:13px;opacity:.9}
main{max-width:760px;margin:auto;padding:14px}.card{background:white;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #0001}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}
input,select,textarea,button{width:100%;font:inherit;border-radius:10px;border:1px solid #cbd5e1;padding:11px;background:white}
textarea{min-height:90px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.readonly{background:#eef2f7}
button{border:0;background:#17365d;color:white;font-weight:700;margin-top:14px}.secondary{background:#64748b}.danger{background:#b91c1c}
.status{font-weight:700}.operative{color:#15803d}.inoperative{color:#b91c1c}.pending{color:#b45309}
.preview{max-width:100%;border-radius:10px;margin-top:8px}.record{border-left:5px solid #17365d;padding:10px 12px;margin:10px 0;background:#f8fafc;border-radius:8px}
.small{font-size:12px;color:#64748b}.hidden{display:none}
</style>
</head>
<body>
<header>
  <h1>Reporte Diario</h1>
  <div class="sub">Registro de mantenimiento de equipos</div>
</header>
<main>
<section class="card">
  <h2>Datos del reporte</h2>
  <div class="row">
    <div><label>Fecha del reporte</label><input id="reportDate" class="readonly" type="date"></div>
    <div><label>Supervisor</label><input id="supervisor" placeholder="Nombre del supervisor"></div>
  </div>
  <label>Turno</label>
  <select id="shift"><option value="">Seleccione turno</option><option>Día</option><option>Noche</option></select>
</section>

<section class="card">
  <h2>Registro del técnico</h2>
  <label>Código de equipo</label>
  <select id="equipment"></select>
  <label>Agregar otro código (opcional)</label>
  <div class="row">
    <input id="newEquipment" placeholder="Ej. S7C-9">
    <button type="button" id="addEquipment">Agregar</button>
  </div>

  <label>Fuente</label>
  <select id="source">
    <option value="">Seleccione fuente</option>
    <option>Inspección en PM</option>
    <option>Inspección</option>
    <option>Reporte del operador</option>
    <option>Trabajo programado</option>
    <option>Otro</option>
  </select>

  <label>Estado del equipo</label>
  <select id="status">
    <option value="">Seleccione estado</option>
    <option>OPERATIVO</option>
    <option>INOPERATIVO</option>
    <option>EN OBSERVACIÓN</option>
  </select>

  <label>Descripción / observación</label>
  <textarea id="description" placeholder="Describa el trabajo, condición encontrada u observación"></textarea>

  <label>Comentario</label>
  <textarea id="comment" placeholder="Comentario adicional"></textarea>

  <label>Fotografía (opcional)</label>
  <input id="photo" type="file" accept="image/*">
  <img id="preview" class="preview hidden">

  <button id="save">Guardar registro</button>
</section>

<section class="card">
  <h2>Registros guardados</h2>
  <div id="records"></div>
</section>
</main>

<script>
const defaultEquipment=["S7C-4","S7C-5","S7C-6","S7C-7","S7C-8","T1D-3","T1D-4","SC-39","SC-41","SC-42","SC-45","SC-46"];
const KEY="reporte_diario_equipos_v3";
const RKEY="reporte_diario_registros_v3";
const $=id=>document.getElementById(id);

function getEquipment(){
  let a=JSON.parse(localStorage.getItem(KEY)||"null");
  if(!Array.isArray(a)||!a.length){a=[...defaultEquipment];localStorage.setItem(KEY,JSON.stringify(a))}
  return a;
}
function fillEquipment(){
  const s=$("equipment"); s.innerHTML='<option value="">Seleccione un equipo</option>';
  getEquipment().forEach(x=>{let o=document.createElement("option");o.value=x;o.textContent=x;s.appendChild(o)})
}
function setDate(){
  const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
  $("reportDate").value=d.toISOString().slice(0,10);
}
$("addEquipment").onclick=()=>{
  const v=$("newEquipment").value.trim().toUpperCase();
  if(!v)return;
  const a=getEquipment(); if(!a.includes(v)){a.push(v);localStorage.setItem(KEY,JSON.stringify(a));}
  fillEquipment(); $("equipment").value=v; $("newEquipment").value="";
};
$("status").onchange=()=>{
  const e=$("status");e.className="";
  if(e.value==="OPERATIVO")e.classList.add("operative");
  if(e.value==="INOPERATIVO")e.classList.add("inoperative");
  if(e.value==="EN OBSERVACIÓN")e.classList.add("pending");
};
$("photo").onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();r.onload=()=>{$("preview").src=r.result;$("preview").classList.remove("hidden")};r.readAsDataURL(f);
};
$("save").onclick=()=>{
  const required=[["equipment","Código de equipo"],["shift","Turno"],["source","Fuente"],["status","Estado del equipo"]];
  for(const [id,n] of required)if(!$(`${id}`).value){alert("Complete: "+n);return}
  const file=$("photo").files[0];
  if(file && !$("comment").value.trim()){alert("Si agrega una fotografía, el comentario es obligatorio.");return}
  const r={
    id:Date.now(),date:$("reportDate").value,supervisor:$("supervisor").value.trim(),
    shift:$("shift").value,equipment:$("equipment").value,source:$("source").value,
    status:$("status").value,description:$("description").value.trim(),
    comment:$("comment").value.trim(),photo:$("preview").src||""
  };
  const list=JSON.parse(localStorage.getItem(RKEY)||"[]");list.unshift(r);localStorage.setItem(RKEY,JSON.stringify(list));
  render(); $("description").value="";$("comment").value="";$("photo").value="";$("preview").src="";$("preview").classList.add("hidden");
  alert("Registro guardado correctamente.");
};
function render(){
  const list=JSON.parse(localStorage.getItem(RKEY)||"[]"), box=$("records");
  if(!list.length){box.innerHTML='<div class="small">No hay registros guardados.</div>';return}
  box.innerHTML="";
  list.forEach(r=>{
    const d=document.createElement("div");d.className="record";
    const cls=r.status==="OPERATIVO"?"operative":r.status==="INOPERATIVO"?"inoperative":"pending";
    d.innerHTML=`<b>Equipo: ${esc(r.equipment)}</b><br>
      <span>Turno: ${esc(r.shift)}</span><br>
      <span>Fuente: ${esc(r.source)}</span><br>
      <span class="status ${cls}">Estado: ${esc(r.status)}</span><br>
      ${r.description?`<span>Descripción: ${esc(r.description)}</span><br>`:""}
      ${r.comment?`<span>Comentario: ${esc(r.comment)}</span><br>`:""}
      <span class="small">Reporte: ${esc(r.date)} · Supervisor: ${esc(r.supervisor||"Sin asignar")}</span>
      ${r.photo?`<img class="preview" src="${r.photo}">`:""}`;
    box.appendChild(d);
  });
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
fillEquipment();setDate();render();
</script>
</body>
</html>
